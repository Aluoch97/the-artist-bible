name: Weekly link & freshness audit

on:
  schedule:
    - cron: '17 9 * * 0' # Sundays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check every URL in industry-data.json
        id: links
        run: |
          set +e
          node scripts/check-links.mjs 2>&1 | tee audit-report.txt
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Flag stale data (lastVerified older than 90 days)
        id: fresh
        run: |
          VERIFIED=$(node -p "require('./src/data/industry-data.json').lastVerified")
          AGE_DAYS=$(node -e "const [y,m]=process.argv[1].split('-').map(Number); console.log(Math.floor((Date.now()-new Date(y,m,0).getTime())/864e5))" "$VERIFIED")
          echo "lastVerified=$VERIFIED ($AGE_DAYS days since end of that month)" | tee -a audit-report.txt
          if [ "$AGE_DAYS" -gt 90 ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; else echo "stale=false" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update an issue on problems
        if: steps.links.outputs.status != '0' || steps.fresh.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly audit: industry data needs attention"
          {
            echo "The scheduled audit found a problem. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat audit-report.txt
            echo '```'
            echo
            echo "Fix \`src/data/industry-data.json\` (URLs, fees, milestones), then update \`lastVerified\` and the chapter frontmatter."
          } > issue-body.md
          EXISTING=$(gh issue list --state open --label audit --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file issue-body.md
          else
            gh label create audit --color D93F0B --description "Automated weekly audit" 2>/dev/null || true
            gh issue create --title "$TITLE" --label audit --body-file issue-body.md
          fi

      - name: Fail the run if any official link is broken
        if: steps.links.outputs.status != '0'
        run: exit 1
