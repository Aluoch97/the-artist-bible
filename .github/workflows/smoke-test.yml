name: Smoke test the live site

# Run on demand (Actions > Smoke test the live site > Run workflow) to confirm the live site and the
# optional AI review endpoint are up. It never sends a contract, so it uses none of the AI allowance.

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: 'Site to test'
        required: true
        default: 'https://bible.nrnszn.com'

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SITE: ${{ github.event.inputs.site || 'https://bible.nrnszn.com' }}
    steps:
      - name: Home page responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/")
          echo "GET / -> $code"; test "$code" = 200
      - name: Security headers present
        run: |
          curl -sI "$SITE/" | grep -iE '^(content-security-policy|strict-transport-security|x-content-type-options)' | cut -c1-90
          curl -sI "$SITE/" | grep -qi '^content-security-policy'
      - name: Version file and admin sign-in answer (nothing private)
        run: |
          curl -s "$SITE/version.json" | grep -q '"version"'
          curl -s "$SITE/api/admin" | grep -Eq '"mode":"(ready|not-set-up)"'
          curl -s "$SITE/api/admin" | grep -vq 'checklist'
      - name: AI endpoint answers (GET reports on/off)
        run: |
          echo "--- GET /api/review-contract"; curl -s -i "$SITE/api/review-contract" | head -20
          curl -s "$SITE/api/review-contract" | grep -q '"enabled"'
      - name: AI endpoint refuses cross-site requests (no AI call is made)
        run: |
          code=$(curl -s -o /tmp/body -w '%{http_code}' -X POST -H 'content-type: application/json' -H 'origin: https://evil.example' -d '{"text":"x"}' "$SITE/api/review-contract")
          echo "POST from another origin -> $code"; cat /tmp/body; echo
          test "$code" = 403 || test "$code" = 503
      - name: Open an issue if the live site is failing (scheduled runs only)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Live site check is failing"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --label audit --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          BODY="The daily check of $SITE failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$EXISTING" ]; then gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"; else gh issue create --repo "${{ github.repository }}" --title "$TITLE" --label audit --body "$BODY"; fi
